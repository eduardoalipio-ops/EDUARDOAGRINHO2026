<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinho 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Agrinho 2026 🌱</h1>
        <p>Descubra a magia da agricultura sustentável!</p>
    </header>

    <main>
        <section class="garden">
            <h2>Plante sua própria fazenda digital</h2>
            <div class="plot">
                <div class="soil" data-plant="wheat"></div>
                <div class="soil" data-plant="corn"></div>
                <div class="soil" data-plant="carrot"></div>
            </div>
            <button id="rainButton">Chover ☔</button>
        </section>

        <section class="info">
            <h2>Informações sobre suas plantas</h2>
            <ul id="plantStatus"></ul>
        </section>
    </main>

    <footer>
        <p>Projeto inspirado no Agrinho 2026 - Criatividade e sustentabilidade na palma da sua mão!</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
